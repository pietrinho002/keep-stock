{% extends "base.html" %}

{% block conteudo %}
<link rel="stylesheet" href="{{ url_for('static', filename='configuracoes.css') }}">

<div id="hero_produtos">
    <div id="titulo_produtos">
        <h5> Gestão </h5> <img src="../static/Icons/Verdes/seta_direita.svg" alt="Seta para direita" id="seta_direita">
        <h2> Configurações </h2>
    </div>
</div>

<main class="container-fluid px-4">
    <div class="row g-4">
        <div class="col-12 col-lg-5">
            <div class="card shadow-sm h-100">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">Dados do Usuário</h5>
                    <p class="card-text mb-2">Nome: {{ usuario.nome }}</p>
                    <p class="card-text mb-2">E-mail: {{ usuario.email }}</p>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">Alterar Senha</h5>
                    <form class="row g-3" method="POST" action="{{ url_for('alterar_senha') }}" autocomplete="off">
                        <div class="col-12">
                            <label class="form-label" for="senha_atual">Senha Atual</label>
                            <input type="password" class="form-control" id="senha_atual" name="senha_atual"
                                placeholder="Digite sua senha atual" required autocomplete="current-password">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="nova_senha">Nova Senha</label>
                            <input type="password" class="form-control" id="nova_senha" name="nova_senha"
                                placeholder="Mínimo de 6 caracteres" minlength="6" required autocomplete="new-password">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="confirmar_senha">Confirmar Nova Senha</label>
                            <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha"
                                placeholder="Digite novamente a nova senha" minlength="6" required
                                autocomplete="new-password">
                        </div>
                        <div class="col-12 d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success" style="background-color: #148577;">Salvar Nova Senha</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
